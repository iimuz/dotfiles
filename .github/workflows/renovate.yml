name: Renovate

on:
  schedule:
    # Run daily at 15:00 UTC (00:00 JST) so conflicted automerge PRs get rebased by the next day;
    # new PRs are limited to Saturday by "schedule" in renovate.json
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level for Renovate"
        type: choice
        default: info
        options:
          - info
          - debug
          - warn

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
