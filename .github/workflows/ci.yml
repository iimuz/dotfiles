name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config-common.toml:${{ github.workspace }}/.config/mise/config-mac.toml:${{ github.workspace }}/.config/mise/config-linux.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run Lint
        run: mise run lint

  test:
    runs-on: ubuntu-latest
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config-common.toml:${{ github.workspace }}/.config/mise/config-mac.toml:${{ github.workspace }}/.config/mise/config-linux.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run Test
        run: mise run test

  format:
    runs-on: ubuntu-latest
    env:
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config-common.toml:${{ github.workspace }}/.config/mise/config-mac.toml:${{ github.workspace }}/.config/mise/config-linux.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Run Format Check
        run: mise run format:check

  status-check:
    if: ${{ !cancelled() }}
    needs: [lint, test, format]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
