[tools]
awscli = { version = "2.36.19", symlink_bins = "true" }
bat = "0.26.1"
cargo-binstall = "1.21.1"
"cargo:tree-sitter-cli" = "0.26.12" # for neovim
claude = "2.1.226"
delta = "0.19.2"
eza = "0.23.5"
fd = "10.4.2"
fzf = "0.74.2"
gh = "2.97.0"
"github:vifm/vifm" = "v0.14.4"
go = "1.26.5"
jq = "1.8.2"
lazygit = "0.63.1"
lua = "5.1.5" # neovim luarocksで要求しているバージョンが5.1
neovim = "0.12.4"
node = "24.18.1"
"npm:@aikidosec/safe-chain" = "1.5.15"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.71" # for claude code
"npm:@github/copilot" = "1.0.78"
"npm:ccusage" = "20.0.19" # for claude code
"npm:context-mode" = "1.0.169" # for claude code
"npm:neovim" = "5.4.0" # for neovim
"pipx:pynvim" = "0.6.0" # for neovim
pnpm = "11.19.0"
python = "3.14.7"
ripgrep = "15.2.0"
rust = "1.97.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.12.3"
yq = "4.53.3"

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2" # 3.13.0 has corrupted rockspec (luarocks/luarocks#1851)
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

# fzf で利用する basepath を `/workspaces` に設定
FFGHQ_MAXDEPTH = 1
FFGHQ_MINDEPTH = 1
SOURCE_ROOT = "/workspaces"

[settings]
activate_aggressive = true
experimental = true

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
