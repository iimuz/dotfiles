[tools]
aws-vault = "7.2.0"
awscli = { version = "2.36.34", symlink_bins = "true" }
cargo-binstall = "1.21.1"
"cargo:tree-sitter-cli" = "0.26.13" # for neovim
claude = "2.1.258"
delta = "0.19.2"
fzf = "0.74.3"
gemini-cli = "0.56.0"
gh = "2.98.0"
"github:vifm/vifm" = "v0.14.4"
go = "1.27.0"
herdr = "0.8.2"
jq = "1.8.2"
lazygit = "0.64.1"
lua = "5.1.5" # neovim luarocksで要求しているバージョンが5.1
node = "24.19.0"
neovim = "0.12.5"
opencode = "v1.18.25"
"npm:@aikidosec/safe-chain" = "1.5.15"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.74"
"npm:ccusage" = "20.0.20" # for claude code
"npm:@github/copilot" = "1.0.81"
"npm:context-mode" = "1.0.169" # for opencode
"npm:mcp-remote" = "0.1.43" # for copilot
"npm:neovim" = "5.4.0" # for neovim
"npm:@playwright/cli" = "0.1.19" # for claude code
"npm:@tobilu/qmd" = "2.8.3" # 日本語 FTS には 2.5.3 以降が必要 (2.5.3-2.8.3 間の中間版は CJK 再構築にバグあり)
"pipx:awslabs.aws-documentation-mcp-server" = "1.1.30"
"pipx:markitdown-mcp" = { version = "0.0.1a4", all = "" } # for copilot
"pipx:pynvim" = "0.6.0" # for neovim
pnpm = "11.22.0"
python = "3.14.7"
rust = "1.98.0"
shellcheck = "0.11.0"
shfmt = "3.13.1"
ripgrep = "15.2.0"
uv = "0.12.7"
yq = "4.53.6"

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2" # 3.13.0 has corrupted rockspec (luarocks/luarocks#1851)
# QMD が aarch64 linux 環境で gpu なしのため強制的に cpu 動作とする(不要にビルドが走ったりするため)
QMD_LLAMA_GPU = "false"
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
activate_aggressive = true
experimental = true

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
