# ~/.config/mise/config.local.toml にリンクする mac だけの設定。config.toml (config-common.toml) より優先される
[tools]
bat = "0.26.1"
eza = "0.23.5"
fd = "10.5.0"
"github:jannis-baum/Vivify" = "0.15.0"

[settings]
# シェルの shim があると、shim から fallback したシェルの exec bash を mise が再帰と誤検出して失敗する
shims.exclude = ["bash", "bashbug"]
