[tools]
awscli = { version = "2.36.14", symlink_bins = "true" }
bat = "0.26.1"
bun = "1.3.14"                                         # for herdr-browser plugin
cargo-binstall = "1.21.1"
"cargo:tree-sitter-cli" = "0.26.8"                     # for neovim
claude = "2.1.220"
colima = "0.10.3"
delta = "0.19.2"
eza = "0.23.5"
fd = "10.4.2"
fzf = "0.74.2"
gh = "2.96.0"
"github:vifm/vifm" = "v0.14.4"
go = "1.26.5"
jq = "1.8.2"
lazygit = "v0.63.1"
lima = "v2.2.0"                                        # colima で必要
lua = "5.1.5"                                          # neovim luarocksで要求しているバージョンが5.1
node = "24.18.1"
"npm:@aikidosec/safe-chain" = "1.5.14"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.67"         # for claude code
"npm:@github/copilot" = "1.0.77"
"npm:ccusage" = "20.0.19"                              # for claude code
"npm:context-mode" = "1.0.169"                         # for claude code
"npm:mcp-remote" = "0.1.38"                            # for copilot
"npm:neovim" = "5.4.0"                                 # for neovim
"pipx:awslabs.aws-documentation-mcp-server" = "1.1.28"
"pipx:pynvim" = "0.6.0"                                # for neovim
pnpm = "11.17.0"
python = "3.14.6"
ripgrep = "15.2.0"
rust = "1.97.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.11.32"
yq = "4.53.3"

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2" # 3.13.0 has corrupted rockspec (luarocks/luarocks#1851)
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
activate_aggressive = true
experimental = true

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
