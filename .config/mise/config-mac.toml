[tools]
awscli = { version = "2.36.24", symlink_bins = "true" }
bat = "0.26.1"
cargo-binstall = "1.21.1"
"cargo:tree-sitter-cli" = "0.26.12" # for neovim
claude = "2.1.258"
colima = "0.10.3"
delta = "0.19.2"
eza = "0.23.5"
fd = "10.4.2"
fzf = "0.74.2"
gh = "2.97.0"
"github:vifm/vifm" = "v0.14.4"
go = "1.26.6"
jq = "1.8.2"
lazygit = "v0.64.1"
lima = "v2.2.0" # colima で必要
lua = "5.1.5" # neovim luarocksで要求しているバージョンが5.1
node = "24.19.0"
"npm:@aikidosec/safe-chain" = "1.5.15"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.73" # for claude code
"npm:@github/copilot" = "1.0.80"
"npm:@playwright/cli" = "0.1.19" # for claude code
"npm:@tobilu/qmd" = "2.8.3" # 日本語 FTS には 2.5.3 以降が必要 (2.5.3-2.8.3 間の中間版は CJK 再構築にバグあり)
"npm:ccusage" = "20.0.20" # for claude code
"npm:context-mode" = "1.0.169" # for claude code
"npm:mcp-remote" = "0.1.38" # for copilot
"npm:neovim" = "5.4.0" # for neovim
"pipx:awslabs.aws-documentation-mcp-server" = "1.1.30"
"pipx:pynvim" = "0.6.0" # for neovim
pnpm = "11.22.0"
python = "3.14.7"
ripgrep = "15.2.0"
rust = "1.97.1"
shellcheck = "0.11.0"
shfmt = "3.13.1"
uv = "0.12.5"
yq = "4.53.3"

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2" # 3.13.0 has corrupted rockspec (luarocks/luarocks#1851)
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
activate_aggressive = true
experimental = true

[settings.npm]
package_manager = "pnpm"

[settings.pipx]
uvx = true
