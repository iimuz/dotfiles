[tools]
awscli = { version = "2.37.9", symlink_bins = "true" }
bat = "0.26.1"
cargo-binstall = "1.24.0"
"cargo:tree-sitter-cli" = "0.27.0" # for neovim
claude = "2.1.296"
delta = "0.19.2"
eza = "0.23.5"
fd = "10.5.0"
fzf = "0.74.4"
gh = "2.101.0"
go = "1.27.1"
jq = "1.8.2"
lazygit = "v0.65.1"
node = "24.21.0"
"npm:@aikidosec/safe-chain" = "1.5.24"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.78" # for claude code
"npm:@playwright/cli" = "0.1.22" # for claude code
"npm:@tobilu/qmd" = "2.8.3" # 日本語 FTS には 2.5.3 以降が必要 (2.5.3-2.8.3 間の中間版は CJK 再構築にバグあり)
"npm:ccusage" = "20.0.26" # for claude code
"npm:context-mode" = "1.0.169" # for claude code
"npm:neovim" = "5.5.0" # for neovim
"pipx:awslabs.aws-documentation-mcp-server" = "1.2.2"
"pipx:pynvim" = "0.6.0" # for neovim
pnpm = "12.7.0"
python = "3.14.8"
ripgrep = "15.2.0"
rust = "1.98.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.12.22"
yq = "4.53.6"

[env]
# UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
activate_aggressive = true
experimental = true
# サプライチェーン対策として公開直後のバージョンは採用しない
minimum_release_age = "3d"
# シェルの shim があると、shim から fallback したシェルの exec bash を mise が再帰と誤検出して失敗する
shims.exclude = ["bash", "bashbug"]

[settings.pipx]
uvx = true
