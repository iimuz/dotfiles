[tools]
cargo-binstall = "1.23.0"
"cargo:tree-sitter-cli" = "0.27.0" # for neovim
go = "1.27.1"
lua = "5.1.5" # neovim luarocksで要求しているバージョンが5.1
node = "24.21.0"
"npm:@aikidosec/safe-chain" = "1.5.16"
"npm:mcp-remote" = "0.14.2" # for copilot
"npm:neovim" = "5.5.0" # for neovim
"pipx:awslabs.aws-documentation-mcp-server" = "1.2.1"
"pipx:markitdown-mcp" = { version = "0.0.1a4", all = "" } # for copilot
"pipx:pynvim" = "0.6.0" # for neovim
pnpm = "12.5.1"
python = "3.14.7"
rust = "1.98.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
uv = "0.12.13"

[env]
ASDF_LUA_LUAROCKS_VERSION = "3.12.2" # 3.13.0 has corrupted rockspec (luarocks/luarocks#1851)

[settings]
experimental = true
# サプライチェーン対策として公開直後のバージョンは採用しない
minimum_release_age = "3d"

[settings.pipx]
uvx = true
