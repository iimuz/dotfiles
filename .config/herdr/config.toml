onboarding = false

[theme]
name = "vesper"

[theme.custom]
# 補助文字。最も読みにくい部分
overlay0 = "#A0A0A0"
# overlay0 より一段明るい補助表示
overlay1 = "#B8B8B8"
# 二次テキスト
subtext0 = "#C8C8C8"
# 通常テキスト
text = "#E6E6E6"

[keys]
focus_agent = "prefix+alt+1..9"
prefix = "ctrl+g"
split_horizontal = "prefix+s"
settings = "prefix+shift+s"

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon", dim = false },
    { token = "workspace", dim = false },
    { token = "tab", dim = false },
  ],
  [
    { token = "terminal_title_stripped", dim = false },
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    { token = "state_icon", dim = false },
    { token = "workspace", dim = false },
    { token = "tab", dim = false },
  ],
  [
    { token = "terminal_title_stripped", dim = false },
  ],
]

[ui.sidebar.spaces]
rows = [
  [
    "state_icon",
    { token = "workspace", dim = false },
  ],
  [
    { token = "branch", dim = false },
    { token = "git_status", dim = false },
  ],
]

[ui.toast]
# Deliver notifications through the outer terminal (escape sequence) so they
# reach the local desktop both on local mac and over ssh. Ghostty forwards
# them to the OS notification center (desktop-notifications is on by default).
delivery = "terminal"
